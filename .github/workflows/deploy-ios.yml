name: Reusable iOS Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (production, staging)'
        required: false
        type: string
        default: 'production'
      xcode-version:
        description: 'Xcode version to use'
        required: false
        type: string
        default: 'latest-stable'
      scheme:
        description: 'Xcode Scheme to build'
        required: true
        type: string
      team-id:
        description: 'Apple Developer Team ID used to export the archive'
        required: true
        type: string
      workspace-path:
        description: 'Path to xcworkspace file'
        required: false
        type: string
        default: 'ios/*.xcworkspace'
    secrets:
      P12_KEY_BASE64:
        description: 'Base64 encoded signing certificate (.p12)'
        required: true
      P12_PASSWORD:
        description: 'Password for the p12 signing certificate'
        required: true
      PROVISION_PROFILE_BASE64:
        description: 'Base64 encoded provisioning profile (.mobileprovision)'
        required: true
      APP_STORE_CONNECT_API_KEY:
        description: 'App Store Connect API Key (Private Key Content)'
        required: true
      APP_STORE_CONNECT_KEY_ID:
        description: 'App Store Connect API Key ID'
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        description: 'App Store Connect Issuer ID'
        required: true

jobs:
  build-and-deploy:
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        if: ${{ inputs.xcode-version != 'latest-stable' }}
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode-version }}.app

      - name: Install Apple Certificates and Provisioning Profiles
        run: |
          # Create and configure temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 14)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Decode certificates and provisioning profiles
          echo "${{ secrets.P12_KEY_BASE64 }}" | base64 --decode > $RUNNER_TEMP/certificate.p12
          echo "${{ secrets.PROVISION_PROFILE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision

          # Import certificate to keychain
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Copy provisioning profile to appropriate folder
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Archive
        run: |
          xcodebuild -workspace ${{ inputs.workspace-path }} \
                     -scheme "${{ inputs.scheme }}" \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/project.xcarchive \
                     archive

      - name: Export IPA
        run: |
          # Create ExportOptions.plist
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ inputs.team-id }}</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/project.xcarchive \
                     -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/build

      - name: Upload to App Store Connect (TestFlight)
        run: |
          # Save API Key file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          
          # Upload IPA using xcrun altool or xcrun notarytool/transporter
          xcrun altool --upload-app \
                       -f $RUNNER_TEMP/build/*.ipa \
                       -t ios \
                       --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                       --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
